name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**','modules/**','effects/**','assets/**','plugins/**','scripts/**','package*.json','app*.js','app.json','App.tsx','index.ts','babel.config.js','tsconfig.json','jest.config.js','.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  ANDROID_VERSION_CODE: ${{ github.run_number }}
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - run: npm ci --no-audit --no-fund
      - name: Check source, camera profiles, shaders and session editing
        run: |
          npm run typecheck
          npm run check:shaders
          npm run check:shader-compile
          npm test -- --runInBand
          npx expo export --platform android --output-dir /tmp/retro-bundle-check --max-workers 2
      - run: npx expo prebuild --clean --platform android --no-install
      - name: Verify native module registration
        run: |
          npx expo-modules-autolinking resolve --platform android > /tmp/expo-modules.json
          node -e "if(!require('fs').readFileSync('/tmp/expo-modules.json','utf8').includes('expo.modules.retroexport.RetroExportModule'))throw Error('Missing exporter');"
      - uses: android-actions/setup-android@v4
        with: {cmdline-tools-version: '12266719', log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - name: Build standalone APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Verify signed APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/YAi-Retro-Camera-0.2.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release-apk/YAi-Retro-Camera-0.2.0.apk
          cd release-apk
          sha256sum YAi-Retro-Camera-0.2.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: 'YAi-Retro-Camera-${{ github.run_number }}', path: 'release-apk/*', if-no-files-found: error}

  native:
    name: Native media tests · Android API ${{ matrix.api }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: {api: [28, 29]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - run: npm ci --no-audit --no-fund
      - uses: android-actions/setup-android@v4
        with: {cmdline-tools-version: '12266719', log-accepted-android-sdk-licenses: false}
      - name: Generate synthetic fixtures and native project
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          bash scripts/make-test-media.sh
          npx expo prebuild --clean --platform android --no-install
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: cd android && ./gradlew :retro-export:connectedDebugAndroidTest --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx2g
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-media-api-${{ matrix.api }}
          path: |
            modules/retro-export/android/build/reports/androidTests/
            modules/retro-export/android/build/outputs/androidTest-results/

  smoke:
    name: App launch · Android API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: {api: [28, 29, 35]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {cmdline-tools-version: '12266719', log-accepted-android-sdk-licenses: false}
      - uses: actions/download-artifact@v4
        with: {name: 'YAi-Retro-Camera-${{ github.run_number }}', path: release-apk}
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back emulated -camera-front emulated
          script: bash scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'app-launch-api-${{ matrix.api }}', path: 'smoke-output/*'}

  publish:
    needs: [build, native, smoke]
    runs-on: ubuntu-22.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: 'YAi-Retro-Camera-${{ github.run_number }}', path: release-apk}
      - name: Publish tested update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v0.2.0-test-${GITHUB_RUN_NUMBER}"
          cat > /tmp/release-notes.md <<'NOTES'
          YAi Retro Camera 0.2.0 — first feature release for Android 9+.
          Six photo/video cameras, effect intensity, Full HD/4K options when supported, removable/reorderable clips, saved gallery management, photo booth/collage/polaroid, media import, date/REC and two interface styles.
          Live microphone is the default. Vintage sound is optional; no artificial crackle is added.
          Build, signature, source tests, synthetic native media tests and emulator launch checks passed. Xiaomi Mi 8 / Android 10 still needs the owner's real camera/microphone test.
          Update over stage-0-3 with the same development signing identity. Do not uninstall first if you want to keep drafts.
          NOTES
          gh release create "$tag" release-apk/* --target "$GITHUB_SHA" --prerelease --title "YAi Retro Camera 0.2.0 · test ${GITHUB_RUN_NUMBER}" --notes-file /tmp/release-notes.md
